name: Preview Deploy

on:
  push:
    branches-ignore:
      - main
      - gh-pages

permissions:
  contents: write
  pull-requests: write

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sanitize branch name
        id: branch
        run: |
          # Replace any non-alphanumeric character (including /) with -
          SAFE=$(echo "${{ github.ref_name }}" \
            | sed 's|[^a-zA-Z0-9]|-|g' \
            | sed 's|-\+|-|g' \
            | sed 's|^-||;s|-$||' \
            | tr '[:upper:]' '[:lower:]')
          echo "safe=${SAFE}" >> $GITHUB_OUTPUT
          echo "url=https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/previews/${SAFE}/" >> $GITHUB_OUTPUT
          echo "Preview URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/previews/${SAFE}/"

      - name: Deploy preview to gh-pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./web
          destination_dir: previews/${{ steps.branch.outputs.safe }}
          keep_files: true
          commit_message: "preview: ${{ github.ref_name }} @ ${{ github.sha }}"

      - name: Find open PR for this branch
        id: find-pr
        uses: actions/github-script@v7
        with:
          result-encoding: string
          script: |
            const { data: prs } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head: `${context.repo.owner}:${context.ref.replace('refs/heads/', '')}`,
              state: 'open'
            });
            return prs.length > 0 ? String(prs[0].number) : '';

      - name: Post or update preview comment on PR
        if: steps.find-pr.outputs.result != ''
        uses: actions/github-script@v7
        with:
          script: |
            const pr   = parseInt('${{ steps.find-pr.outputs.result }}');
            const url  = '${{ steps.branch.outputs.url }}';
            const sha  = '${{ github.sha }}'.slice(0, 7);
            const body = [
              '### Preview deployed',
              '',
              `**URL:** ${url}`,
              `**Commit:** \`${sha}\``,
              `**Updated:** ${new Date().toUTCString()}`,
              '',
              '_This comment is updated automatically on every push to this branch._'
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr
            });

            const existing = comments.find(c =>
              c.user.login === 'github-actions[bot]' &&
              c.body.includes('Preview deployed')
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr,
                body
              });
            }
