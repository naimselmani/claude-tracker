name: Deploy

# Pushes to `main` deploy to the live root URL.
# Pushes to any other branch deploy to /preview/<slug>/ on the same
# site so you can test on the actual live origin before merging.

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

# Serialize so concurrent deploys don't fight over the gh-pages branch.
concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute target directory
        id: target
        shell: bash
        run: |
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            echo "dir="             >> "$GITHUB_OUTPUT"
            echo "url_path=/"       >> "$GITHUB_OUTPUT"
            echo "label=production" >> "$GITHUB_OUTPUT"
          else
            slug=$(printf '%s' "$GITHUB_REF_NAME" \
              | tr '/_ ' '-' \
              | tr -cd 'a-zA-Z0-9-' \
              | tr 'A-Z' 'a-z')
            echo "dir=preview/${slug}"       >> "$GITHUB_OUTPUT"
            echo "url_path=/preview/${slug}/" >> "$GITHUB_OUTPUT"
            echo "label=preview"             >> "$GITHUB_OUTPUT"
          fi

      - name: Cache-bust local assets in preview HTML
        # Preview deploys overwrite files at the same URL each push, so
        # browsers serve stale assets from disk cache even after reloading.
        # Appending ?v=<sha> to .js/.css refs forces a fresh fetch.
        # Skipped for production where we keep stable URLs.
        if: steps.target.outputs.label == 'preview'
        shell: bash
        run: |
          SHA="${GITHUB_SHA:0:7}"
          while IFS= read -r -d '' f; do
            sed -E -i 's#((href|src)=")([A-Za-z0-9_./-]+\.(js|css))"#\1\3?v='"$SHA"'"#g' "$f"
          done < <(find ./web -name index.html -print0)

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./web
          publish_branch: gh-pages
          destination_dir: ${{ steps.target.outputs.dir }}
          keep_files: true
          commit_message: "deploy(${{ steps.target.outputs.label }}): ${{ github.event.head_commit.message || github.ref_name }}"
          user_name: "github-actions[bot]"
          user_email: "github-actions[bot]@users.noreply.github.com"

      - name: Print deploy URL
        run: |
          echo "::notice title=Deployed::https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}${{ steps.target.outputs.url_path }}"

      - name: Post or update preview comment on PR
        if: steps.target.outputs.label == 'preview'
        uses: actions/github-script@v7
        with:
          script: |
            const { data: prs } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head: `${context.repo.owner}:${context.ref.replace('refs/heads/', '')}`,
              state: 'open'
            });
            if (prs.length === 0) return;

            const url  = `https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}${{ steps.target.outputs.url_path }}`;
            const sha  = '${{ github.sha }}'.slice(0, 7);
            const body = [
              '### Preview deployed',
              '',
              `**URL:** ${url}`,
              `**Commit:** \`${sha}\``,
              `**Updated:** ${new Date().toUTCString()}`,
              '',
              '_Updated automatically on every push to this branch._'
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prs[0].number
            });
            const existing = comments.find(c =>
              c.user.login === 'github-actions[bot]' &&
              c.body.includes('Preview deployed')
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prs[0].number,
                body
              });
            }
